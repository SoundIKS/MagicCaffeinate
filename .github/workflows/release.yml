name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Универсальный DMG
    # Сборка кросс-компилирует второй срез (build.sh --universal), поэтому раннер
    # любой архитектуры даёт универсальный бандл. macos-latest — самый доступный
    # стандартный образ; arm64-образы (macos-14+) на бесплатных аккаунтах могут
    # быть недоступны («configuration is not supported»).
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: BUILD_NUMBER = число коммитов.
          fetch-depth: 0

      - name: Определить версию
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Собираю версию ${version}"

      - name: Собрать приложение и DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
        run: |
          set -euo pipefail
          ./build.sh dmg
          cp "dist/MagicCaffeinate-${VERSION}.dmg" dist/MagicCaffeinate.dmg
          sha="$(shasum -a 256 "dist/MagicCaffeinate-${VERSION}.dmg" | cut -d' ' -f1)"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}"

      - name: Проверить бандл
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          plutil -lint MagicCaffeinate.app/Contents/Info.plist
          codesign --verify --deep --strict MagicCaffeinate.app
          archs="$(lipo -archs MagicCaffeinate.app/Contents/MacOS/MagicCaffeinate)"
          echo "архитектуры: ${archs}"
          [ "${archs}" = "x86_64 arm64" ] || { echo "ожидался универсальный бинарник"; exit 1; }
          [ -f "MagicCaffeinate.app/Contents/Resources/AppIcon.icns" ] || { echo "нет иконки"; exit 1; }

      - name: Выложить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: MagicCaffeinate-${{ steps.version.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MagicCaffeinate-${{ steps.version.outputs.version }}.dmg
            dist/MagicCaffeinate.dmg
          generate_release_notes: true
          body: |
            ## Установка

            Homebrew (рекомендуется):

            ```bash
            brew install --cask ${{ github.repository_owner }}/tap/magiccaffeinate
            ```

            Или вручную: скачайте `MagicCaffeinate-${{ steps.version.outputs.version }}.dmg`,
            откройте образ, перетащите **MagicCaffeinate** в *Applications* и снимите карантин:

            ```bash
            xattr -dr com.apple.quarantine /Applications/MagicCaffeinate.app
            ```

            Ещё вариант — установка из терминала скриптом:

            ```bash
            curl -fL -o /tmp/magiccaffeinate-install.sh https://raw.githubusercontent.com/${{ github.repository }}/master/Scripts/install.sh
            bash /tmp/magiccaffeinate-install.sh
            ```

            SHA-256: `${{ steps.package.outputs.sha256 }}`

            Сборка подписана ad-hoc (без Developer ID и нотаризации Apple), поэтому
            Gatekeeper не подтверждает издателя: cask и скрипт снимают карантин сами,
            при ручной установке это делается командой `xattr`.

  tap:
    name: Обновить Homebrew-тэп
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить наличие токена
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::секрет TAP_TOKEN не задан — cask в тэпе не обновляю"
          fi

      - name: Обновить cask в тэпе
        if: steps.token.outputs.present == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: ${{ secrets.TAP_REPO }}
          VERSION: ${{ needs.package.outputs.version }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="${TAP_REPO:-${OWNER}/homebrew-tap}"
          work="$(mktemp -d)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${repo}.git" "$work/tap"
          mkdir -p "$work/tap/Casks"
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256__|${SHA256}|g" \
              -e "s|__OWNER__|${OWNER}|g" \
              packaging/magiccaffeinate.rb.tmpl > "$work/tap/Casks/magiccaffeinate.rb"
          cd "$work/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/magiccaffeinate.rb
          if git diff --cached --quiet; then
            echo "cask уже актуален"
          else
            git commit -m "magiccaffeinate ${VERSION}"
            git push
          fi
